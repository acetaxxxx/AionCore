name: Main Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-self-host-builder:
    name: Publish self-host builder image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/acetaxxxx/aioncore-builder
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish the AionCore artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.self-host-builder
          target: artifact
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main

      - name: Publish image summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## AionCore self-host artifact ready

          - immutable: \`$IMAGE:${{ github.sha }}\`
          - current main: \`$IMAGE:main\`
          EOF
