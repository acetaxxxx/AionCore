name: Remote Rustfmt (one-shot)

on:
  push:
    branches:
      - feat/agent-memory-promotion

permissions:
  contents: write

concurrency:
  group: remote-rustfmt-feat-agent-memory-promotion
  cancel-in-progress: true

jobs:
  format:
    # The marker prevents the formatter's own push from recursively running it.
    if: ${{ !startsWith(github.event.head_commit.message, '[remote-rustfmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Format the feature branch
        run: cargo fmt --all

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Rustfmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "[remote-rustfmt] format feat/agent-memory-promotion"
          git push origin "HEAD:${GITHUB_REF_NAME}"
