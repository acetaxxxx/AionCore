name: Remote Rustfmt (one-shot)

on:
  push:
    branches:
      - feat/agent-memory-promotion

permissions:
  contents: write

concurrency:
  group: remote-rustfmt-feat-agent-memory-promotion
  cancel-in-progress: true

jobs:
  format:
    name: Format feature branch on GitHub runner
    if: ${{ !contains(github.event.head_commit.message, '[remote-rustfmt]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Validate exact feature ref and commit
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/agent-memory-promotion"
          test -n "$GITHUB_SHA"

      - name: Check out pushed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Apply cargo fmt
        run: cargo fmt --all

      - name: Commit formatter output
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "cargo fmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply remote rustfmt [remote-rustfmt]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
